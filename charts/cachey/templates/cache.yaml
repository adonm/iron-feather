# One Cachey Deployment + Service per zone per shard. Readers in a zone
# hash each object to its owning shard, so the page cache is shared
# zone-wide with stable ownership. Cache disk is node-local (hostPath
# NVMe, one dir per shard); Deployments pin to their zone.
# Recreate (never RollingUpdate): two Cachey processes must never open the
# same hostPath cache dir at once. A reschedule to another node in the zone
# starts cold on that node's disk; treat node replacement as a cold cache.
{{- range $zone := .Values.zones }}
{{- range $i := until ($.Values.shards | int) }}
{{- $name := printf "%s-s%d" (include "cachey.zoneName" (list $ $zone)) $i }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["{{ $zone }}"]
      containers:
        - name: cachey
          image: {{ $.Values.images.cachey }}
          args:
            - --memory
            - {{ $.Values.cache.memory }}
            - --disk-path
            - /cache
            - --disk-capacity
            - {{ $.Values.cache.diskCapacity }}
            - --max-download-memory
            - {{ $.Values.cache.maxDownloadMemory }}
            - --port
            - "80"
          ports:
            - name: http
              containerPort: 80
          env:
            - name: AWS_REGION
              value: {{ $.Values.s3.region | quote }}
            - name: AWS_ENDPOINT_URL_S3
              value: {{ $.Values.s3.endpointUrl | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.s3.existingSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.s3.existingSecret }}
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: cache
              mountPath: /cache
      volumes:
        - name: cache
          hostPath:
            path: {{ $.Values.cache.dir }}-{{ $zone }}-s{{ $i }}
            type: DirectoryOrCreate
{{- end }}
{{- end }}
