{{- if .Values.backend.enabled -}}
# Dev-only S3 identity for the loopback rig: the same pair as
# backend.authUser/authPassword, consumed by Cachey (via s3.existingSecret)
# and the writer/seed upload sidecars. Prod disables backend and supplies
# this Secret out of band (IRSA / external-secrets).
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3.existingSecret }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.backend.authUser | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.backend.authPassword | quote }}
{{- end -}}
