{{- if .Values.backend.enabled -}}
# Local-rig S3 stand-in (MinIO, single node). Prod disables this and points
# s3.endpointUrl at real S3 with creds via IRSA/external-secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cachey.fullname" . }}-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cachey.fullname" . }}-minio
  template:
    metadata:
      labels:
        app: {{ include "cachey.fullname" . }}-minio
    spec:
      # hostPath data is node-local: pin to one zone so reschedules keep
      # their disk (same zone the seed job and writer build in).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["{{ first .Values.zones }}"]
      containers:
        - name: minio
          image: {{ .Values.images.minio }}
          args: ["server", "/data"]
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.backend.authUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cachey.fullname" . }}-minio-auth
                  key: password
            - name: MINIO_DOMAIN
              value: s3.minio.localhost
          ports:
            - name: s3
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /nvme/minio-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cachey.fullname" . }}-minio-auth
type: Opaque
stringData:
  password: {{ .Values.backend.authPassword | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cachey.fullname" . }}-minio
spec:
  selector:
    app: {{ include "cachey.fullname" . }}-minio
  ports:
    - name: s3
      port: 9000
# NOTE: dev-only credentials in values (single-node rig, no sensitive data).
# Buckets autocreate on first write; no layout/key bootstrap step exists.
{{- end -}}
