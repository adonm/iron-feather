# One Cachey per zone over the same S3 bucket. Every reader pod in a zone
# fetches Parquet/ catalog byte ranges through its zone's Service, so the
# 16 MiB page cache is shared zone-wide with no CSI, FUSE, or sidecars.
zones:
  - az-a
  - az-b

# Consistent-hash cache shards per zone. Each object has exactly one owning
# shard (readers hash the filename), so adding shards splits the working
# set instead of duplicating it. Services are <fullname>-cachey-<zone>-s<i>
# with one hostPath dir each. Scale past one AZ cache by raising this and
# reinstalling; readers learn the count from the iron-feather chart
# (its `cachey.shards` must match).
shards: 1

images:
  # Pinned by digest; refresh deliberately (see docs/cachey-lake.md).
  cachey: ghcr.io/s2-streamstore/cachey@sha256:beab43f996c0d183d4c3adb68257d342ef87d700befe5b30c196f8a1524b96ca
  minio: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e

# Cache budgets per zone instance.
cache:
  memory: 4GiB
  diskCapacity: 100GiB
  maxDownloadMemory: 1GiB
  # Node-local storage (NVMe in prod; the kind /nvme extraMount in the rig)
  # so reads stay AZ-local after fill.
  dir: /nvme/cachey

# S3 source of truth. Readers never see these: only Cachey fetches from S3.
# Prod points endpointUrl at real S3 and supplies creds via IRSA or
# external-secrets instead of existingSecret.
# The dev default is the bundled MinIO Service short name: DuckDB always
# sends `C0-Config: fps=true` (see setup_session), so the SDK uses
# path-style against the endpoint host itself, which plain cluster DNS
# resolves via search domains. No wildcard DNS, no CoreDNS hacks; real S3
# works the same way (virtual-hosted there is native, path-style allowed).
s3:
  endpointUrl: http://lake-minio:9000
  region: us-east-1
  existingSecret: lake-s3 # keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

# Local-rig S3 stand-in (MinIO). Prod disables this.
backend:
  enabled: true
  # Dev-only credentials (single-node rig). The chart writes the same pair
  # into the dev Secret below; keep them in sync with scripts/dev-s3.env.
  authUser: devkey
  authPassword: devsecret123

# Per-zone per-shard Service names are <fullname>-cachey-<zone>-s<i>;
# readers address http://<that>/fetch/<bucket>/<key> with plain ranged GETs.
