# One StorageClass per zone. The `gateway` parameter selects the 9P endpoint
# a pod's mount follows; today every zone points at the writer (the only
# serving gateway — verified: standbys refuse 9P until failover, and
# independent leaders fence each other). Pointing a zone at a future
# read-serving replica is a values-only change; the per-zone names are the
# routing seam the CSI extension will key off.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zerofs.fullname" . }}-csi-admin
stringData:
  adminEndpoint: http://{{ include "zerofs.gwName" (list . .Values.writerZone) }}:7000
---
{{- range $zone := .Values.zones }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ include "zerofs.fullname" $ }}-lake-{{ $zone }}
provisioner: csi.zerofs.net
parameters:
  gateway: {{ include "zerofs.gwName" (list $ $.Values.writerZone) }}:5564
  adminEndpoint: http://{{ include "zerofs.gwName" (list $ $.Values.writerZone) }}:7000
  volumesRoot: {{ $.Values.volumesRoot | quote }}
  csi.storage.k8s.io/provisioner-secret-name: {{ include "zerofs.fullname" $ }}-csi-admin
  csi.storage.k8s.io/provisioner-secret-namespace: {{ $.Release.Namespace | quote }}
  csi.storage.k8s.io/controller-publish-secret-name: {{ include "zerofs.fullname" $ }}-csi-admin
  csi.storage.k8s.io/controller-publish-secret-namespace: {{ $.Release.Namespace | quote }}
  csi.storage.k8s.io/node-publish-secret-name: {{ include "zerofs.fullname" $ }}-csi-admin
  csi.storage.k8s.io/node-publish-secret-namespace: {{ $.Release.Namespace | quote }}
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: false
{{- end }}
