# Read pool over the Cachey-cached lake. Readers are plain HTTP clients of
# their zone's Cachey: no volumes, no CSI, no mounts.
image:
  repository: iron-feather
  tag: latest
  pullPolicy: IfNotPresent

# S3 bucket holding catalogs/, data/ and refs/. Only Cachey and the
# writer talk to S3; readers only ever fetch ranged HTTP from Cachey.
s3bucket: lake

# Concrete published catalog readers pin to (restart/rollout to move).
# Written by the seed job or the writer; see refs/ in S3 for history.
catalog: sha_berlin.ducklake

# One Deployment per zone; each pod fetches through its zone's Cachey
# Service, so the page cache is shared zone-wide.
replicasPerZone: 1
zones:
  - az-a
  - az-b
resources: {}
#  requests:
#    memory: 5Gi
#    cpu: "2"

service:
  port: 3000

# S3 endpoint + Secret for the writer/seed upload sidecars. Defaults address
# the bundled MinIO; point at real S3 when cachey.enabled=false.
# cacheyUrlBase overrides the per-zone Cachey base readers and the writer use
# (default: this release's zone Services).
s3endpoint: ""
s3secret: ""
cacheyUrlBase: ""

# Optional single writer: hourly build + S3 upload + ref move (the ETL
# publisher). The only component allowed to mutate refs. Needs the S3
# Secret (same one Cachey uses) for the upload sidecar.
writer:
  enabled: false
  schedule: "0 * * * *"
  bbox: 13.35,52.48,13.45,52.55
  limit: 20000
  collection: buildings
  dataPrefix: data

# Subchart (MinIO + per-zone Cachey). Disable when pointing at an
# existing estate (then set cacheyUrl overrides explicitly).
cachey:
  enabled: true
