# Read pool over the Cachey-cached lake. Readers are plain HTTP clients of
# their zone's Cachey: no volumes, no CSI, no mounts.
image:
  repository: iron-feather
  tag: latest
  pullPolicy: IfNotPresent

# S3 bucket holding catalogs/, data/ and refs/. Only Cachey and the
# writer talk to S3; readers only ever fetch ranged HTTP from Cachey.
s3bucket: lake

# Concrete published catalog readers pin to (restart/rollout to move).
# Written by the seed job or the writer; see refs/ in S3 for history.
catalog: sha_berlin.ducklake

# One Deployment per zone; each pod fetches through its zone's Cachey
# Service, so the page cache is shared zone-wide.
replicasPerZone: 1
zones:
  - az-a
  - az-b
resources: {}
#  requests:
#    memory: 5Gi
#    cpu: "2"

service:
  port: 3000

# S3 key prefix holding the immutable Parquet data files. The published
# catalog stores `s3://<bucket>/<dataPrefix>/` as its DATA_PATH; readers
# override it per zone to their Cachey (`--data-base`), so the same
# snapshot serves zone-local everywhere. The writer builds with the same
# prefix.
dataPrefix: data

# S3 endpoint + Secret for the writer/seed upload sidecars. Defaults address
# the bundled MinIO; point at real S3 when cachey.enabled=false.
# cacheyUrlBase overrides the per-zone Cachey bases readers use with one
# externally managed base (single shard; default: this release's zone
# shard Services). Shard count lives in the cachey subchart
# (`--set cachey.shards=N`); readers derive one --data-base per shard.
s3endpoint: ""
s3secret: ""
cacheyUrlBase: ""

# Dedicated bulk pool (Flight + heavy OGC) pinned to the same catalog.
# Disabled by default: enable when bulk scans threaten interactive pages.
# Bulk pods carry no bulk-concurrency cap so large scans flow; the
# interactive pool serves HTTP only, so bulk Flight must go here.
# Flight is the bulk protocol (Quack was removed); the Service exposes
# both HTTP and Flight.
bulk:
  enabled: false
  replicasPerZone: 1
  flightConcurrency: 0
  connections: 4
  resources: {}

# Optional single writer: hourly build + S3 upload + ref move (the ETL
# publisher). The only component allowed to mutate refs. Needs the S3
# Secret (same one Cachey uses) for the upload sidecar.
writer:
  enabled: false
  schedule: "0 * * * *"
  bbox: 13.35,52.48,13.45,52.55
  limit: 20000
  collection: buildings

# Subchart (MinIO + per-zone Cachey). Disable when pointing at an
# existing estate (then set cacheyUrl overrides explicitly).
cachey:
  enabled: true
