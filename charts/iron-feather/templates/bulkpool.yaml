{{- /* Dedicated bulk pool: same catalog and Cachey shards as the interactive
      pool, but uncapped bulk concurrency and its own replicas/resources so
      broad scans and Flight exports never starve small pages. Exposes HTTP
      and Flight. Disabled by default (see values.bulk). */ -}}
{{- if .Values.bulk.enabled }}
{{- $shards := until (($.Values.cachey.shards | default 1) | int) }}
{{- range $zone := .Values.zones }}
{{- $bases := list }}
{{- if $.Values.cacheyUrlBase }}{{ $bases = append $bases $.Values.cacheyUrlBase }}{{ else }}{{ range $i := $shards }}{{ $bases = append $bases (printf "http://%s-cachey-%s-s%d" (include "ifeather.fullname" $) $zone $i) }}{{ end }}{{ end }}
{{- $cachey := printf "%s/fetch/%s" (index $bases 0) $.Values.s3bucket }}
{{- $shard := printf "%s/catalogs/%s" $cachey $.Values.catalog }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ifeather.fullname" $ }}-bulk-{{ $zone }}
spec:
  replicas: {{ $.Values.bulk.replicasPerZone }}
  selector:
    matchLabels:
      app: {{ include "ifeather.fullname" $ }}-bulk
      zone: {{ $zone }}
  template:
    metadata:
      labels:
        app: {{ include "ifeather.fullname" $ }}-bulk
        zone: {{ $zone }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["{{ $zone }}"]
      containers:
        - name: serve
          image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - exec iron-feather serve --shard '{{ $shard }}'{{ range $b := $bases }} --data-base '{{ $b }}/fetch/{{ $.Values.s3bucket }}/{{ $.Values.dataPrefix }}/'{{ end }} --listen 0.0.0.0:3000 --flight-listen 0.0.0.0:50051 --connections {{ $.Values.bulk.connections }} --flight-concurrency {{ $.Values.bulk.flightConcurrency }}
          ports:
            - name: http
              containerPort: 3000
            - name: flight
              containerPort: 50051
          resources: {{ toYaml $.Values.bulk.resources | nindent 12 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ifeather.fullname" . }}-bulk
spec:
  selector:
    app: {{ include "ifeather.fullname" . }}-bulk
  ports:
    - name: http
      port: 3000
      targetPort: http
    - name: flight
      port: 50051
      targetPort: flight
{{- end }}
