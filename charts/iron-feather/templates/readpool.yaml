apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ifeather.fullname" . }}-lake
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: {{ include "ifeather.storageClass" . | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ifeather.fullname" . }}-read
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ include "ifeather.fullname" . }}-read
  template:
    metadata:
      labels:
        app: {{ include "ifeather.fullname" . }}-read
    spec:
      # One reader per zone; each resolves the ref once at startup and stays
      # pinned to that snapshot until restarted (rollout on publish).
      # Readers wait for the first publish instead of crash-looping.
      initContainers:
        - name: wait-for-publish
          image: busybox:stable-musl
          command: ["sh", "-c", "until [ -f /lake/refs/latest ]; do sleep 5; done"]
          volumeMounts:
            - name: lake
              mountPath: /lake
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: {{ include "ifeather.fullname" . }}-read
      containers:
        - name: serve
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - exec iron-feather serve --shard "/lake/catalogs/$(cat /lake/refs/$LAKE_REF)" --listen 0.0.0.0:3000 --cache-mb {{ .Values.cacheMb }}
          env:
            - name: LAKE_REF
              value: {{ .Values.ref | quote }}
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: lake
              mountPath: /lake
              readOnly: true
          resources: {{ toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: lake
          persistentVolumeClaim:
            claimName: {{ include "ifeather.fullname" . }}-lake
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ifeather.fullname" . }}-read
spec:
  selector:
    app: {{ include "ifeather.fullname" . }}-read
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
