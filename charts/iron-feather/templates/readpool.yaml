{{- /* One Deployment per zone behind a shared Service. Each pod pins to the
     concrete catalog in .Values.catalog and fetches Parquet/catalog byte
     ranges through its zone's Cachey, so the page cache is shared zone-wide.
     Readers wait for the first publish instead of crash-looping. */ -}}
{{- range $zone := .Values.zones }}
{{- $zoneBase := $.Values.cacheyUrlBase | default (printf "http://%s-cachey-%s" (include "ifeather.fullname" $) $zone) }}
{{- $cachey := printf "%s/fetch/%s" $zoneBase $.Values.s3bucket }}
{{- $shard := printf "%s/catalogs/%s" $cachey $.Values.catalog }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ifeather.fullname" $ }}-read-{{ $zone }}
spec:
  replicas: {{ $.Values.replicasPerZone }}
  selector:
    matchLabels:
      app: {{ include "ifeather.fullname" $ }}-read
      zone: {{ $zone }}
  template:
    metadata:
      labels:
        app: {{ include "ifeather.fullname" $ }}-read
        zone: {{ $zone }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["{{ $zone }}"]
      initContainers:
        - name: wait-for-publish
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          # Cachey requires a Range header even on probes (bare HEAD is 400)
          # and answers 206, which wget reports as an error: gate on the
          # status line itself.
          command: ["sh", "-c", "until wget -O /dev/null --header 'Range: bytes=0-0' '{{ $shard }}' 2>&1 | grep -q '206 Partial Content'; do sleep 5; done"]
      containers:
        - name: serve
          image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - exec iron-feather serve --shard '{{ $shard }}' --listen 0.0.0.0:3000
          ports:
            - name: http
              containerPort: 3000
          resources: {{ toYaml $.Values.resources | nindent 12 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ifeather.fullname" . }}-read
spec:
  selector:
    app: {{ include "ifeather.fullname" . }}-read
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
