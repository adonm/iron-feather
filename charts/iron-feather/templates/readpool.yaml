{{- /* One Deployment per zone behind a shared Service. Each pod pins to the
     concrete catalog in .Values.catalog and fetches its catalog bytes plus
     Parquet ranges through its zone's Cachey shards: --data-base repeats
     once per shard and the server hashes each object to its owning shard,
     so no zone reads through another zone and shard ownership is stable
     across restarts and scales. A cacheyUrlBase override means one
     externally managed base (single shard). Readers wait for the first
     publish instead of crash-looping. */ -}}
{{- $shards := until (($.Values.cachey.shards | default 1) | int) }}
{{- range $zone := .Values.zones }}
{{- $bases := list }}
{{- if $.Values.cacheyUrlBase }}{{ $bases = append $bases $.Values.cacheyUrlBase }}{{ else }}{{ range $i := $shards }}{{ $bases = append $bases (printf "http://%s-cachey-%s-s%d" (include "ifeather.fullname" $) $zone $i) }}{{ end }}{{ end }}
{{- $cachey := printf "%s/fetch/%s" (index $bases 0) $.Values.s3bucket }}
{{- $shard := printf "%s/catalogs/%s" $cachey $.Values.catalog }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ifeather.fullname" $ }}-read-{{ $zone }}
spec:
  replicas: {{ $.Values.replicasPerZone }}
  selector:
    matchLabels:
      app: {{ include "ifeather.fullname" $ }}-read
      zone: {{ $zone }}
  template:
    metadata:
      labels:
        app: {{ include "ifeather.fullname" $ }}-read
        zone: {{ $zone }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["{{ $zone }}"]
      initContainers:
        - name: wait-for-publish
          image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          # Cachey requires a Range header even on probes (bare HEAD is 400)
          # and answers 206, which wget reports as an error: gate on the
          # status line itself. C0-Config: fps=true forces path-style S3,
          # without which Cachey tries virtual-hosted bucket.host and the
          # lookup fails (same header DuckDB sends via its HTTP secret).
          command: ["sh", "-c", "until wget -O /dev/null --header 'Range: bytes=0-0' --header 'C0-Config: fps=true' '{{ $shard }}' 2>&1 | grep -q '206 Partial Content'; do sleep 5; done"]
      containers:
        - name: serve
          image: {{ $.Values.image.repository }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - exec iron-feather serve --shard '{{ $shard }}'{{ range $b := $bases }} --data-base '{{ $b }}/fetch/{{ $.Values.s3bucket }}/{{ $.Values.dataPrefix }}/'{{ end }} --listen 0.0.0.0:3000
          ports:
            - name: http
              containerPort: 3000
          resources: {{ toYaml $.Values.resources | nindent 12 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ifeather.fullname" . }}-read
spec:
  selector:
    app: {{ include "ifeather.fullname" . }}-read
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
