{{- if .Values.writer.enabled }}
{{- /* Optional single writer (the only component allowed to mutate refs):
     hourly build of a new immutable snapshot into scratch, upload of data
     + catalog to S3, then the ref move. Disabled by default. */ -}}
{{- $wzone := .Values.zones | first }}
{{- $base := .Values.cacheyUrlBase | default (printf "http://%s-cachey-%s" (include "ifeather.fullname" .) $wzone) }}
{{- $dataUrl := printf "%s/fetch/%s/%s/" $base .Values.s3bucket .Values.writer.dataPrefix }}
{{- $endpoint := .Values.s3endpoint | default (printf "http://%s-minio:9000" (include "ifeather.fullname" .)) }}
{{- $secret := .Values.s3secret | default .Values.cachey.s3.existingSecret }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ifeather.fullname" . }}-writer
spec:
  schedule: {{ .Values.writer.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: topology.kubernetes.io/zone
                        operator: In
                        values: ["{{ $wzone }}"]
          initContainers:
            - name: build
              image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - sh
                - -c
                - |
                  set -eu
                  sha="sha_$(date -u +%Y%m%dT%H%M)"
                  printf '%s' "$sha.ducklake" > /stage/catalog-name
                  iron-feather build --bbox={{ .Values.writer.bbox }} \
                    --limit {{ .Values.writer.limit }} \
                    --collection {{ .Values.writer.collection }} \
                    --out "/stage/$sha.ducklake" \
                    --data-dir /stage/files \
                    --data-url '{{ $dataUrl }}'
              volumeMounts:
                - name: stage
                  mountPath: /stage
          containers:
            - name: publish
              image: rclone/rclone@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
              command:
                - sh
                - -c
                - |
                  set -eu
                  name=$(cat /stage/catalog-name)
                  rclone sync /stage/files "lake:{{ .Values.s3bucket }}/{{ .Values.writer.dataPrefix }}/"
                  rclone copyto "/stage/$name" "lake:{{ .Values.s3bucket }}/catalogs/$name"
                  rclone rcat "lake:{{ .Values.s3bucket }}/refs/latest" < /stage/catalog-name
                  echo "published $name"
              env:
                - name: RCLONE_CONFIG_LAKE_TYPE
                  value: s3
                - name: RCLONE_CONFIG_LAKE_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_LAKE_ENDPOINT
                  value: {{ $endpoint | quote }}
                - name: RCLONE_CONFIG_LAKE_REGION
                  value: us-east-1
                - name: RCLONE_CONFIG_LAKE_FORCE_PATH_STYLE
                  value: "true"
                - name: RCLONE_CONFIG_LAKE_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secret }}
                      key: AWS_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_LAKE_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secret }}
                      key: AWS_SECRET_ACCESS_KEY
              volumeMounts:
                - name: stage
                  mountPath: /stage
          volumes:
            - name: stage
              emptyDir: {}
{{- end }}
