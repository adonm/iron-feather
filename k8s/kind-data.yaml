# kind-local lake volume: hostPath on the az-a worker's /nvme mount,
# pre-seeded with a published snapshot by `just kind-seed`. Used with
# csi.enabled=false (see k8s/kind-values.yaml).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: lake-lake
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /nvme/lake
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lake-lake
  namespace: lake
spec:
  accessModes:
    - ReadOnlyMany
  storageClassName: ""
  resources:
    requests:
      storage: 10Gi
  volumeName: lake-lake
