# One-shot seeder: builds the Berlin snapshot, uploads data + catalog to S3,
# and moves refs/latest at it. Mirrors what the optional writer CronJob does
# on its hourly cadence. Readers fetch everything through their zone's Cachey.
apiVersion: batch/v1
kind: Job
metadata:
  name: lake-seed-berlin
  namespace: lake
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values: ["az-a"]
      initContainers:
        - name: build
          image: iron-feather:kind
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              iron-feather build --bbox=13.35,52.48,13.45,52.55 --limit 20000 \
                --content-address \
                --out /stage/sha_berlin.ducklake \
                --data-dir /stage/files \
                --data-url 's3://lake/data/'
              printf '%s' sha_berlin.ducklake > /stage/catalog-name
          volumeMounts:
            - name: stage
              mountPath: /stage
      containers:
        - name: publish
          image: rclone/rclone@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              name=$(cat /stage/catalog-name)
              # Additive only: never delete data another snapshot references.
              # The seed catalog key is fixed; skip the upload when a previous
              # seed already published it (idempotent re-runs).
              rclone copy /stage/files lake:lake/data/
              if ! rclone lsf "lake:lake/catalogs/" 2>/dev/null | grep -qx "$name"; then
                rclone copyto "/stage/$name" "lake:lake/catalogs/$name"
              fi
              if ! rclone lsf "lake:lake/catalogs/" 2>/dev/null | grep -qx "$name.serving.json"; then
                rclone copyto "/stage/$name.serving.json" "lake:lake/catalogs/$name.serving.json"
              fi
              rclone rcat lake:lake/refs/latest < /stage/catalog-name
              rclone rcat lake:lake/refs/main < /stage/catalog-name
              echo seeded
          env:
            - name: RCLONE_CONFIG_LAKE_TYPE
              value: s3
            - name: RCLONE_CONFIG_LAKE_PROVIDER
              value: Other
            - name: RCLONE_CONFIG_LAKE_ENDPOINT
              value: http://lake-minio:9000
            - name: RCLONE_CONFIG_LAKE_REGION
              value: us-east-1
            - name: RCLONE_CONFIG_LAKE_FORCE_PATH_STYLE
              value: "true"
            - name: RCLONE_CONFIG_LAKE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: lake-s3
                  key: AWS_ACCESS_KEY_ID
            - name: RCLONE_CONFIG_LAKE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lake-s3
                  key: AWS_SECRET_ACCESS_KEY
          volumeMounts:
            - name: stage
              mountPath: /stage
      volumes:
        - name: stage
          emptyDir: {}
