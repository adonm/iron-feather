name: ci
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - run: gofmt -l cmd internal
      - run: go vet ./...
      - run: go test ./...
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: helm lint charts/lakewing
      - run: helm template lake charts/lakewing --set catalog=sha_test.ducklake > /dev/null
