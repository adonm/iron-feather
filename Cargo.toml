[package]
name = "iron-feather"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OGC API Features, vector tiles and Arrow Flight over DuckLake on S3"
repository = "https://github.com/adonm/iron-feather"
rust-version = "1.85.1"

[dependencies]
poem = { version = "3", features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_urlencoded = "0.7"
percent-encoding = "2"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Focused, shared XYZ tile math.
martin-tile-utils = "0.7"

# Prebuilt binaries only: `default-features = false` guarantees the `bundled`
# C++ build never kicks in. Linked lib comes from $DUCKDB_LIB_DIR
# (`just setup-duckdb`) or the build-script auto-download.
duckdb = { git = "https://github.com/duckdb/duckdb-rs", rev = "fdd481e7fbc5fa4e59a715431ffa9d40c94b5956", default-features = false }
moka = { version = "0.12", features = ["future"] }
tonic = "0.14"
# Match duckdb's Arrow major so batches pass directly into Flight.
arrow-flight = "59"
futures = "0.3"
tempfile = "3"

[dev-dependencies]
poem = { version = "3", features = ["test"] }
prost = "0.14"
