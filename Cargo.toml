[package]
name = "iron-feather"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OGC API Features, vector tiles and Arrow Flight over DuckLake on S3"
repository = "https://github.com/adonm/iron-feather"
rust-version = "1.85.1"

[dependencies]
poem = { version = "3", features = ["server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_urlencoded = "0.7"
percent-encoding = "2"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Content-addressed publish: stable data-file names from file bytes.
sha2 = { version = "0.10", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Focused, shared XYZ tile math.
martin-tile-utils = "0.7"

# Prebuilt engine only: `duckdb-neo` links the shared library from
# $DUCKDB_LIB_DIR (`just setup-duckdb`). All DuckDB access goes through the
# stable v2 C API; there is no v1 `duckdb` dependency.
duckdb-neo = { git = "https://github.com/duckdb/duckdb-rs", rev = "fdd481e7fbc5fa4e59a715431ffa9d40c94b5956", default-features = false }
# Raw v2 bindings for the cross-thread interrupt handle (stable ABI).
libduckdb-sys = { git = "https://github.com/duckdb/duckdb-rs", rev = "fdd481e7fbc5fa4e59a715431ffa9d40c94b5956", default-features = false, features = ["capi-v2"] }
tonic = "0.14"
# Match duckdb's Arrow major so batches pass directly into Flight.
arrow-flight = "59"
arrow = { version = "59", features = ["ffi"] }
futures = "0.3"
tempfile = "3"

[dev-dependencies]
poem = { version = "3", features = ["test"] }
prost = "0.14"
